[package]
name = "aerogallery"
version = "0.1.0"
description = "A local photo gallery"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico", "tga", "qoi", "pnm"] }
rusqlite = { version = "0.37", features = ["bundled"] }
fast_image_resize = "5.5"
kamadak-exif = "0.6"
notify = "8"
rayon = "1.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
