name: Windows gallery
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Prepare licensed nature preview
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force public/appearance | Out-Null
          $source = Join-Path $env:RUNNER_TEMP 'fall-field.jpg'
          $url = 'https://upload.wikimedia.org/wikipedia/commons/1/1c/Green_rolling_hills_are_accompanied_by_tall_trees_and_a_blue_sky_in_the_background._%288462d90c-90a0-4138-a3ba-b3aa237e468a%29.JPG'
          Invoke-WebRequest -Uri $url -UserAgent 'AeroGallery/0.1 (https://github.com/meshahid973/aerogallery)' -OutFile $source -TimeoutSec 30
          Add-Type -AssemblyName System.Drawing
          $photo = [System.Drawing.Image]::FromFile($source)
          $thumb = New-Object System.Drawing.Bitmap($photo, 480, 320)
          $thumb.Save((Join-Path (Get-Location) 'public/appearance/nature.jpg'), [System.Drawing.Imaging.ImageFormat]::Jpeg)
          $thumb.Dispose()
          $photo.Dispose()
          $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path (Get-Location) 'public/appearance/nature.jpg')))
          Write-Output 'BEGIN_NATURE'
          for ($i = 0; $i -lt $b64.Length; $i += 1024) { Write-Output ('NATURE_DATA ' + $b64.Substring($i, [Math]::Min(1024, $b64.Length - $i))) }
          Write-Output 'END_NATURE'
      - run: pnpm build
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml --locked
      - run: pnpm tauri build --no-bundle -- --locked
      - run: git diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: windows-gallery
          path: src-tauri/target/release/aerogallery.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-preview
          path: dist/
          if-no-files-found: error
