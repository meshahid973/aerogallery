name: Windows gallery
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: pnpm build
      - run: node --experimental-strip-types --test tests/releases.test.mjs
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml --locked
      - run: pnpm tauri build --bundles nsis -- --locked
      - name: Verify installer registrations
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - run: git diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: windows-gallery
          path: |
            src-tauri/target/release/aerogallery.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-preview
          path: dist/
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Merge AeroGallery release 0.1.0')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-gallery
          path: release
      - name: Publish first Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -ne '0.1.0') { throw 'Unexpected release version.' }
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists." }
          $installers = @(Get-ChildItem release -Recurse -File -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          $installer = $installers[0].FullName
          $hashFile = Join-Path $installers[0].DirectoryName 'SHA256SUMS.txt'
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installers[0].Name)" | Set-Content $hashFile -Encoding ascii
          gh release create $tag $installer $hashFile --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "AeroGallery $version" --notes-file .github/release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
