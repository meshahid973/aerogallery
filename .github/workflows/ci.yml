name: Windows foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path pnpm-lock.yaml) { pnpm install --frozen-lockfile } else { pnpm install --no-frozen-lockfile }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path src-tauri/Cargo.lock) { cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 | Out-Null } else { cargo generate-lockfile --manifest-path src-tauri/Cargo.toml }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture dependency locks
        uses: actions/upload-artifact@v4
        with:
          name: foundation-lockfiles
          path: |
            pnpm-lock.yaml
            src-tauri/Cargo.lock
          if-no-files-found: error
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: pnpm tauri build --no-bundle
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-foundation
          path: src-tauri/target/release/aerogallery.exe
          if-no-files-found: error
