name: Prepare image engine
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo update --workspace --manifest-path src-tauri/Cargo.toml
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Export resolved lock and formatted source
        shell: bash
        run: |
          for f in src-tauri/Cargo.lock src-tauri/src/*.rs src-tauri/build.rs; do
            echo "BEGIN_FILE $f"
            git hash-object "$f" | sed 's/^/FILE_HASH /'
            base64 -w 1024 "$f" | sed 's/^/FILE_DATA /'
            echo "END_FILE $f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: engine-preview
          path: dist/
